<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="760" viewBox="0 0 1220 760">
  <style>
    .actor { fill: #fff; stroke: #222; stroke-width: 2; }
    .head { fill: #e8f0fe; stroke: #222; stroke-width: 2; }
    .life { stroke: #777; stroke-width: 2; stroke-dasharray: 6 6; }
    .msg { stroke: #222; stroke-width: 2; marker-end: url(#arrow); }
    .return { stroke: #555; stroke-width: 2; stroke-dasharray: 5 5; marker-end: url(#arrow2); }
    .title { font: bold 18px Arial, sans-serif; }
    .text { font: 14px Arial, sans-serif; }
    .small { font: 13px Arial, sans-serif; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#222" />
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555" />
    </marker>
  </defs>

  <text x="40" y="38" class="title">Sekvensdiagram - Anmäla medlem till spelträff</text>

  <rect x="35" y="70" width="140" height="46" class="head"/>
  <text x="70" y="99" class="text">Användare</text>

  <rect x="235" y="70" width="150" height="46" class="head"/>
  <text x="263" y="99" class="text">MainWindow</text>

  <rect x="445" y="70" width="165" height="46" class="head"/>
  <text x="472" y="99" class="text">MainViewModel</text>

  <rect x="670" y="70" width="165" height="46" class="head"/>
  <text x="696" y="99" class="text">ForeningService</text>

  <rect x="895" y="70" width="165" height="46" class="head"/>
  <text x="912" y="99" class="text">ForeningDbContext</text>

  <rect x="1090" y="70" width="105" height="46" class="head"/>
  <text x="1114" y="99" class="text">SpelTraff</text>

  <line x1="105" y1="116" x2="105" y2="705" class="life"/>
  <line x1="310" y1="116" x2="310" y2="705" class="life"/>
  <line x1="528" y1="116" x2="528" y2="705" class="life"/>
  <line x1="753" y1="116" x2="753" y2="705" class="life"/>
  <line x1="978" y1="116" x2="978" y2="705" class="life"/>
  <line x1="1143" y1="116" x2="1143" y2="705" class="life"/>

  <line x1="105" y1="155" x2="310" y2="155" class="msg"/>
  <text x="125" y="145" class="small">1. Väljer medlem och spelträff</text>

  <line x1="310" y1="205" x2="528" y2="205" class="msg"/>
  <text x="330" y="195" class="small">2. Binding: ValdMedlem, ValdTraff</text>

  <line x1="105" y1="255" x2="310" y2="255" class="msg"/>
  <text x="125" y="245" class="small">3. Klickar Anmäl</text>

  <line x1="310" y1="305" x2="528" y2="305" class="msg"/>
  <text x="335" y="295" class="small">4. AnmalCommand</text>

  <line x1="528" y1="355" x2="753" y2="355" class="msg"/>
  <text x="555" y="345" class="small">5. AnmalAsync(medlemId, traffId)</text>

  <line x1="753" y1="405" x2="978" y2="405" class="msg"/>
  <text x="780" y="395" class="small">6. Hämta medlem och träff</text>

  <line x1="978" y1="455" x2="753" y2="455" class="return"/>
  <text x="805" y="445" class="small">7. Objekt returneras</text>

  <line x1="753" y1="505" x2="1143" y2="505" class="msg"/>
  <text x="805" y="495" class="small">8. Anmal(medlem)</text>

  <line x1="1143" y1="555" x2="753" y2="555" class="return"/>
  <text x="815" y="545" class="small">9. Regler godkända</text>

  <line x1="753" y1="605" x2="978" y2="605" class="msg"/>
  <text x="785" y="595" class="small">10. ForeningDbContext.SaveChangesAsync()</text>

  <line x1="753" y1="655" x2="528" y2="655" class="return"/>
  <text x="575" y="645" class="small">11. Klar</text>

  <line x1="528" y1="690" x2="310" y2="690" class="return"/>
  <text x="342" y="680" class="small">12. Listor uppdateras</text>
</svg>
