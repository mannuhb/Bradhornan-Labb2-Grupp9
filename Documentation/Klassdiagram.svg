<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130">
  <style>
    .page { fill: #f8fafc; }
    .titleBox { fill: #111827; stroke: #111827; stroke-width: 2; }
    .title { font: bold 26px Arial, sans-serif; fill: #ffffff; }
    .subtitle { font: 15px Arial, sans-serif; fill: #e5e7eb; }
    .classBox { fill: #ffffff; stroke: #111827; stroke-width: 2.5; }
    .domainHead { fill: #dbeafe; stroke: #111827; stroke-width: 2.5; }
    .serviceHead { fill: #dcfce7; stroke: #111827; stroke-width: 2.5; }
    .viewHead { fill: #ede9fe; stroke: #111827; stroke-width: 2.5; }
    .dbHead { fill: #fef3c7; stroke: #111827; stroke-width: 2.5; }
    .sectionLine { stroke: #111827; stroke-width: 2; }
    .className { font: bold 18px Arial, sans-serif; fill: #111827; }
    .member { font: 14px Arial, sans-serif; fill: #111827; }
    .method { font: 14px Arial, sans-serif; fill: #111827; }
    .pk { font: bold 14px Arial, sans-serif; fill: #dc2626; }
    .fk { font: bold 14px Arial, sans-serif; fill: #2563eb; }
    .ak { font: bold 14px Arial, sans-serif; fill: #7c3aed; }
    .assoc { stroke: #111827; stroke-width: 3; fill: none; }
    .useLine { stroke: #111827; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    .labelBox { fill: #f9fafb; stroke: #374151; stroke-width: 1.8; }
    .label { font: bold 13px Arial, sans-serif; fill: #111827; }
    .small { font: 13px Arial, sans-serif; fill: #374151; }
    .legend { fill: #fff7ed; stroke: #9a3412; stroke-width: 2; }
  </style>

  <defs>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="11" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,10 L12,5 z" fill="#111827" />
    </marker>
  </defs>

  <rect class="page" width="1600" height="1130"/>

  <g transform="translate(40 24)">
    <rect class="titleBox" width="1520" height="82" rx="6"/>
    <text class="title" x="28" y="35">Klassdiagram - Br&#228;dh&#246;rnan Labb 2</text>
    <text class="subtitle" x="28" y="62">Relationerna f&#246;ljer modellen: Forening 1 till 0..* Medlem, Spel och SpelTraff samt Medlem 0..* till 0..* SpelTraff.</text>
  </g>

  <!-- Forening -->
  <g transform="translate(60 150)">
    <rect class="classBox" width="350" height="275"/>
    <rect class="domainHead" width="350" height="48"/>
    <text class="className" x="132" y="31">Forening</text>
    <text class="member" x="22" y="82">+ Medlemmar: List&lt;Medlem&gt;</text>
    <text class="member" x="22" y="112">+ Spel: List&lt;Spel&gt;</text>
    <text class="member" x="22" y="142">+ Speltraffar: List&lt;SpelTraff&gt;</text>
    <line class="sectionLine" x1="0" y1="162" x2="350" y2="162"/>
    <text class="method" x="22" y="190">+ AvregistreraMedlem(...): void</text>
    <text class="method" x="22" y="220">+ SparraMedlem(...): void</text>
    <text class="method" x="22" y="250">+ Sortera / Gruppera</text>
  </g>

  <!-- Medlem -->
  <g transform="translate(560 145)">
    <rect class="classBox" width="370" height="390"/>
    <rect class="domainHead" width="370" height="48"/>
    <text class="className" x="150" y="31">Medlem</text>
    <text class="pk" x="22" y="78">PK</text><text class="member" x="72" y="78">+ Id: int</text>
    <text class="member" x="22" y="108">+</text><text class="member" x="72" y="108">Medlemsnummer: int [NotMapped]</text>
    <text class="member" x="22" y="138">+</text><text class="member" x="72" y="138">Namn: string</text>
    <text class="member" x="22" y="168">+</text><text class="member" x="72" y="168">Efternamn: string</text>
    <text class="ak" x="22" y="198">AK</text><text class="member" x="72" y="198">+ Epost: string [unik]</text>
    <text class="ak" x="22" y="228">AK</text><text class="member" x="72" y="228">+ Mobilnummer: string [unik]</text>
    <text class="member" x="22" y="258">+</text><text class="member" x="72" y="258">Roll: string</text>
    <text class="member" x="22" y="288">+</text><text class="member" x="72" y="288">ArSparrad: bool</text>
    <text class="member" x="22" y="318">+</text><text class="member" x="72" y="318">Speltraffar: List&lt;SpelTraff&gt;</text>
    <line class="sectionLine" x1="0" y1="336" x2="370" y2="336"/>
    <text class="method" x="22" y="362">+ UppdateraKontaktuppgifter(...): void</text>
    <text class="method" x="22" y="384">+ Sparra() / Avsparra(): void</text>
  </g>

  <!-- Spel -->
  <g transform="translate(560 655)">
    <rect class="classBox" width="370" height="320"/>
    <rect class="domainHead" width="370" height="48"/>
    <text class="className" x="165" y="31">Spel</text>
    <text class="pk" x="22" y="78">PK</text><text class="member" x="72" y="78">+ Id: int</text>
    <text class="member" x="22" y="108">+</text><text class="member" x="72" y="108">Titel: string</text>
    <text class="member" x="22" y="138">+</text><text class="member" x="72" y="138">Kategori: string</text>
    <text class="member" x="22" y="168">+</text><text class="member" x="72" y="168">MinSpelare: int</text>
    <text class="member" x="22" y="198">+</text><text class="member" x="72" y="198">MaxSpelare: int</text>
    <text class="member" x="22" y="228">+</text><text class="member" x="72" y="228">Speltraffar: List&lt;SpelTraff&gt;</text>
    <line class="sectionLine" x1="0" y1="246" x2="370" y2="246"/>
    <text class="method" x="22" y="272">+ Uppdatera(...): void</text>
    <text class="method" x="22" y="296">+ ToString(): string</text>
  </g>

  <!-- SpelTraff -->
  <g transform="translate(1110 345)">
    <rect class="classBox" width="410" height="430"/>
    <rect class="domainHead" width="410" height="48"/>
    <text class="className" x="160" y="31">SpelTraff</text>
    <text class="pk" x="22" y="78">PK</text><text class="member" x="72" y="78">+ Id: int</text>
    <text class="member" x="22" y="108">+</text><text class="member" x="72" y="108">Namn: string</text>
    <text class="member" x="22" y="138">+</text><text class="member" x="72" y="138">Plats: string</text>
    <text class="member" x="22" y="168">+</text><text class="member" x="72" y="168">DatumTid: DateTime</text>
    <text class="member" x="22" y="198">+</text><text class="member" x="72" y="198">MinDeltagare: int</text>
    <text class="member" x="22" y="228">+</text><text class="member" x="72" y="228">MaxDeltagare: int</text>
    <text class="member" x="22" y="258">+</text><text class="member" x="72" y="258">SpeltidMinuter: int</text>
    <text class="fk" x="22" y="288">FK</text><text class="member" x="72" y="288">+ SpelId: int</text>
    <text class="member" x="22" y="318">+</text><text class="member" x="72" y="318">Spel: Spel</text>
    <text class="member" x="22" y="348">+</text><text class="member" x="72" y="348">Deltagare: List&lt;Medlem&gt;</text>
    <text class="member" x="22" y="378">+</text><text class="member" x="72" y="378">LedigaPlatser: int</text>
    <line class="sectionLine" x1="0" y1="394" x2="410" y2="394"/>
    <text class="method" x="22" y="418">+ Anmal(medlem) / Avanmal(medlem): void</text>
  </g>

  <!-- Application classes -->
  <g transform="translate(60 690)">
    <rect class="classBox" width="350" height="205"/>
    <rect class="viewHead" width="350" height="48"/>
    <text class="className" x="108" y="31">MainViewModel</text>
    <text class="member" x="22" y="82">+ Medlemmar: ObservableCollection</text>
    <text class="member" x="22" y="112">+ Spel: ObservableCollection</text>
    <text class="member" x="22" y="142">+ Speltraffar: ObservableCollection</text>
    <text class="member" x="22" y="172">+ Commands</text>
  </g>

  <g transform="translate(60 930)">
    <rect class="classBox" width="350" height="115"/>
    <rect class="serviceHead" width="350" height="42"/>
    <text class="className" x="102" y="28">ForeningService</text>
    <text class="method" x="22" y="70">+ Registrera / Uppdatera / Ta bort</text>
    <text class="method" x="22" y="98">+ AnmalAsync() / AvanmalAsync()</text>
  </g>

  <g transform="translate(560 1010)">
    <rect class="classBox" width="370" height="58"/>
    <rect class="dbHead" width="370" height="58"/>
    <text class="className" x="108" y="36">ForeningDbContext</text>
  </g>

  <!-- Exact domain relations requested -->
  <path class="assoc" d="M410 205 H560"/>
  <g transform="translate(430 160)">
    <rect class="labelBox" width="110" height="70" rx="4"/>
    <text class="label" x="16" y="24">Forening 1</text>
    <text class="label" x="16" y="48">0..* Medlem</text>
  </g>

  <path class="assoc" d="M235 425 V815 H560"/>
  <g transform="translate(260 545)">
    <rect class="labelBox" width="105" height="70" rx="4"/>
    <text class="label" x="14" y="24">Forening 1</text>
    <text class="label" x="14" y="48">0..* Spel</text>
  </g>

  <path class="assoc" d="M410 285 H1020 V560 H1110"/>
  <g transform="translate(610 252)">
    <rect class="labelBox" width="135" height="70" rx="4"/>
    <text class="label" x="14" y="24">Forening 1</text>
    <text class="label" x="14" y="48">0..* SpelTraff</text>
  </g>

  <path class="assoc" d="M930 815 H1315 V775"/>
  <g transform="translate(1010 780)">
    <rect class="labelBox" width="130" height="70" rx="4"/>
    <text class="label" x="14" y="24">Spel 1</text>
    <text class="label" x="14" y="48">0..* SpelTraff</text>
  </g>
  <g transform="translate(1165 802)">
    <rect class="labelBox" width="100" height="46" rx="4"/>
    <text class="small" x="13" y="19">FK: SpelId</text>
    <text class="small" x="13" y="36">till Spel.Id</text>
  </g>

  <path class="assoc" d="M930 340 H1110"/>
  <g transform="translate(958 270)">
    <rect class="labelBox" width="135" height="70" rx="4"/>
    <text class="label" x="13" y="24">Medlem 0..*</text>
    <text class="label" x="13" y="48">0..* SpelTraff</text>
  </g>

  <!-- Exact architecture relations requested -->
  <path class="useLine" d="M235 895 V930"/>
  <g transform="translate(252 900)">
    <rect class="labelBox" width="82" height="36" rx="4"/>
    <text class="small" x="13" y="23">anvander</text>
  </g>

  <path class="useLine" d="M410 988 H560"/>
  <g transform="translate(438 940)">
    <rect class="labelBox" width="82" height="36" rx="4"/>
    <text class="small" x="13" y="23">anvander</text>
  </g>

  <path class="useLine" d="M745 1010 V975"/>
  <g transform="translate(948 988)">
    <rect class="labelBox" width="260" height="50" rx="4"/>
    <text class="small" x="14" y="20">ForeningDbContext hanterar</text>
    <text class="small" x="14" y="38">Medlem, Spel och SpelTraff</text>
  </g>
  <path class="assoc" d="M930 1038 H948"/>

  <g transform="translate(40 1090)">
    <rect class="legend" width="1520" height="24" rx="4"/>
    <text class="small" x="18" y="17">PK = primarnyckel, FK = frammande nyckel, AK = alternativ unik nyckel. Kardinalitet: 1 betyder en, 0..* betyder noll eller flera.</text>
  </g>
</svg>
