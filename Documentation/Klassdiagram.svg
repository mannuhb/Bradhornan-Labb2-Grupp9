<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1185" viewBox="0 0 1600 1185">
  <style>
    .page { fill: #f8fafc; }
    .titleBox { fill: #111827; stroke: #111827; stroke-width: 2; }
    .title { font: bold 26px Arial, sans-serif; fill: #ffffff; }
    .subtitle { font: 15px Arial, sans-serif; fill: #e5e7eb; }
    .classBox { fill: #ffffff; stroke: #111827; stroke-width: 2.5; }
    .domainHead { fill: #dbeafe; stroke: #111827; stroke-width: 2.5; }
    .serviceHead { fill: #dcfce7; stroke: #111827; stroke-width: 2.5; }
    .viewHead { fill: #ede9fe; stroke: #111827; stroke-width: 2.5; }
    .dbHead { fill: #fef3c7; stroke: #111827; stroke-width: 2.5; }
    .sectionLine { stroke: #111827; stroke-width: 2; }
    .className { font: bold 18px Arial, sans-serif; fill: #111827; }
    .member { font: 14px Arial, sans-serif; fill: #111827; }
    .method { font: 14px Arial, sans-serif; fill: #111827; }
    .assoc { stroke: #111827; stroke-width: 3; fill: none; }
    .useLine { stroke: #111827; stroke-width: 2; stroke-dasharray: 8 8; fill: none; marker-end: url(#arrow); }
    .inherit { stroke: #111827; stroke-width: 3; fill: none; marker-end: url(#inheritArrow); }
    .labelBox { fill: #f9fafb; stroke: #374151; stroke-width: 1.8; }
    .label { font: bold 13px Arial, sans-serif; fill: #111827; }
    .small { font: 13px Arial, sans-serif; fill: #374151; }
    .legend { fill: #fff7ed; stroke: #9a3412; stroke-width: 2; }
  </style>

  <defs>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="11" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,10 L12,5 z" fill="#111827" />
    </marker>
    <marker id="inheritArrow" markerWidth="18" markerHeight="18" refX="16" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L16,8 L0,16 z" fill="#ffffff" stroke="#111827" stroke-width="2" />
    </marker>
  </defs>

  <rect class="page" width="1600" height="1185"/>

  <g transform="translate(40 24)">
    <rect class="titleBox" width="1520" height="82" rx="6"/>
    <text class="title" x="28" y="35">Klassdiagram - Br&#228;dh&#246;rnan Labb 2</text>
    <text class="subtitle" x="28" y="62">UML-diagram med klasser, relationer, kardinalitet och arv mellan ViewModelBase och MainViewModel.</text>
  </g>

  <!-- Domain classes -->
  <g transform="translate(60 150)">
    <rect class="classBox" width="350" height="275"/>
    <rect class="domainHead" width="350" height="48"/>
    <text class="className" x="132" y="31">Forening</text>
    <text class="member" x="22" y="82">+ Medlemmar: List&lt;Medlem&gt;</text>
    <text class="member" x="22" y="112">+ Spel: List&lt;Spel&gt;</text>
    <text class="member" x="22" y="142">+ Speltraffar: List&lt;SpelTraff&gt;</text>
    <line class="sectionLine" x1="0" y1="162" x2="350" y2="162"/>
    <text class="method" x="22" y="190">+ AvregistreraMedlem(...): void</text>
    <text class="method" x="22" y="220">+ SparraMedlem(...): void</text>
    <text class="method" x="22" y="250">+ Sortera / Gruppera</text>
  </g>

  <g transform="translate(560 145)">
    <rect class="classBox" width="370" height="390"/>
    <rect class="domainHead" width="370" height="48"/>
    <text class="className" x="150" y="31">Medlem</text>
    <text class="member" x="22" y="78">+ Id: int</text>
    <text class="member" x="22" y="108">+ Medlemsnummer: int</text>
    <text class="member" x="22" y="138">+ Namn: string</text>
    <text class="member" x="22" y="168">+ Efternamn: string</text>
    <text class="member" x="22" y="198">+ Epost: string</text>
    <text class="member" x="22" y="228">+ Mobilnummer: string</text>
    <text class="member" x="22" y="258">+ Roll: string</text>
    <text class="member" x="22" y="288">+ ArSparrad: bool</text>
    <text class="member" x="22" y="318">+ Speltraffar: List&lt;SpelTraff&gt;</text>
    <line class="sectionLine" x1="0" y1="336" x2="370" y2="336"/>
    <text class="method" x="22" y="362">+ Sparra(): void</text>
    <text class="method" x="22" y="384">+ Avsparra(): void</text>
  </g>

  <g transform="translate(560 655)">
    <rect class="classBox" width="370" height="320"/>
    <rect class="domainHead" width="370" height="48"/>
    <text class="className" x="165" y="31">Spel</text>
    <text class="member" x="22" y="78">+ Id: int</text>
    <text class="member" x="22" y="108">+ Titel: string</text>
    <text class="member" x="22" y="138">+ Kategori: string</text>
    <text class="member" x="22" y="168">+ MinSpelare: int</text>
    <text class="member" x="22" y="198">+ MaxSpelare: int</text>
    <text class="member" x="22" y="228">+ Speltraffar: List&lt;SpelTraff&gt;</text>
    <line class="sectionLine" x1="0" y1="246" x2="370" y2="246"/>
    <text class="method" x="22" y="272">+ Uppdatera(...): void</text>
    <text class="method" x="22" y="296">+ ToString(): string</text>
  </g>

  <g transform="translate(1110 345)">
    <rect class="classBox" width="410" height="430"/>
    <rect class="domainHead" width="410" height="48"/>
    <text class="className" x="160" y="31">SpelTraff</text>
    <text class="member" x="22" y="78">+ Id: int</text>
    <text class="member" x="22" y="108">+ Namn: string</text>
    <text class="member" x="22" y="138">+ Plats: string</text>
    <text class="member" x="22" y="168">+ DatumTid: DateTime</text>
    <text class="member" x="22" y="198">+ MinDeltagare: int</text>
    <text class="member" x="22" y="228">+ MaxDeltagare: int</text>
    <text class="member" x="22" y="258">+ SpeltidMinuter: int</text>
    <text class="member" x="22" y="288">+ SpelId: int</text>
    <text class="member" x="22" y="318">+ Spel: Spel</text>
    <text class="member" x="22" y="348">+ Deltagare: List&lt;Medlem&gt;</text>
    <text class="member" x="22" y="378">+ LedigaPlatser: int</text>
    <line class="sectionLine" x1="0" y1="394" x2="410" y2="394"/>
    <text class="method" x="22" y="418">+ Anmal(medlem) / Avanmal(medlem): void</text>
  </g>

  <!-- Application classes -->
  <g transform="translate(60 615)">
    <rect class="classBox" width="350" height="125"/>
    <rect class="viewHead" width="350" height="48"/>
    <text class="className" x="112" y="31">ViewModelBase</text>
    <text class="member" x="22" y="82">+ PropertyChanged: event</text>
    <text class="method" x="22" y="110"># OnPropertyChanged(...): void</text>
  </g>

  <g transform="translate(60 800)">
    <rect class="classBox" width="350" height="205"/>
    <rect class="viewHead" width="350" height="48"/>
    <text class="className" x="108" y="31">MainViewModel</text>
    <text class="member" x="22" y="82">+ Medlemmar: ObservableCollection&lt;Medlem&gt;</text>
    <text class="member" x="22" y="112">+ Spel: ObservableCollection&lt;Spel&gt;</text>
    <text class="member" x="22" y="142">+ Speltraffar: ObservableCollection&lt;SpelTraff&gt;</text>
    <text class="member" x="22" y="172">+ ValdMedlem / ValdTraff</text>
    <line class="sectionLine" x1="0" y1="184" x2="350" y2="184"/>
    <text class="method" x="22" y="198">+ LaddaAsync(): Task</text>
  </g>

  <g transform="translate(560 1010)">
    <rect class="classBox" width="370" height="115"/>
    <rect class="serviceHead" width="370" height="42"/>
    <text class="className" x="112" y="28">ForeningService</text>
    <text class="method" x="22" y="70">+ Registrera / Uppdatera / Ta bort</text>
    <text class="method" x="22" y="98">+ AnmalAsync() / AvanmalAsync()</text>
  </g>

  <g transform="translate(1110 900)">
    <rect class="classBox" width="410" height="210"/>
    <rect class="dbHead" width="410" height="48"/>
    <text class="className" x="126" y="31">ForeningDbContext</text>
    <text class="member" x="22" y="82">+ Medlemmar: DbSet&lt;Medlem&gt;</text>
    <text class="member" x="22" y="112">+ Spel: DbSet&lt;Spel&gt;</text>
    <text class="member" x="22" y="142">+ Speltraffar: DbSet&lt;SpelTraff&gt;</text>
    <line class="sectionLine" x1="0" y1="152" x2="410" y2="152"/>
    <text class="method" x="22" y="178">+ OnConfiguring(...): void</text>
    <text class="method" x="22" y="204">+ OnModelCreating(...): void</text>
  </g>

  <!-- Exact domain relations -->
  <path class="assoc" d="M410 205 H560"/>
  <g transform="translate(430 160)">
    <rect class="labelBox" width="110" height="70" rx="4"/>
    <text class="label" x="16" y="24">Forening 1</text>
    <text class="label" x="16" y="48">0..* Medlem</text>
  </g>

  <path class="assoc" d="M410 400 H500 V815 H560"/>
  <g transform="translate(430 705)">
    <rect class="labelBox" width="105" height="70" rx="4"/>
    <text class="label" x="14" y="24">Forening 1</text>
    <text class="label" x="14" y="48">0..* Spel</text>
  </g>

  <path class="assoc" d="M410 250 H500 V125 H1315 V345"/>
  <g transform="translate(920 120)">
    <rect class="labelBox" width="135" height="70" rx="4"/>
    <text class="label" x="14" y="24">Forening 1</text>
    <text class="label" x="14" y="48">0..* SpelTraff</text>
  </g>

  <path class="assoc" d="M930 815 H1040 V560 H1110"/>
  <g transform="translate(960 705)">
    <rect class="labelBox" width="130" height="70" rx="4"/>
    <text class="label" x="14" y="24">Spel 1</text>
    <text class="label" x="14" y="48">0..* SpelTraff</text>
  </g>

  <path class="assoc" d="M930 420 H1110"/>
  <g transform="translate(968 352)">
    <rect class="labelBox" width="135" height="70" rx="4"/>
    <text class="label" x="13" y="24">Medlem 0..*</text>
    <text class="label" x="13" y="48">0..* SpelTraff</text>
  </g>

  <!-- Inheritance and dependency relations -->
  <path class="inherit" d="M235 800 V740"/>
  <g transform="translate(258 752)">
    <rect class="labelBox" width="178" height="32" rx="4"/>
    <text class="small" x="12" y="21">MainViewModel : ViewModelBase</text>
  </g>

  <path class="useLine" d="M410 902 H500 V1068 H560"/>
  <g transform="translate(430 862)">
    <rect class="labelBox" width="82" height="36" rx="4"/>
    <text class="small" x="13" y="23">beroende</text>
  </g>

  <path class="useLine" d="M930 1068 H1110"/>
  <g transform="translate(978 1028)">
    <rect class="labelBox" width="82" height="36" rx="4"/>
    <text class="small" x="13" y="23">beroende</text>
  </g>

  <g transform="translate(1110 1122)">
    <rect class="labelBox" width="350" height="30" rx="4"/>
    <text class="small" x="14" y="20">ForeningDbContext hanterar Medlem, Spel och SpelTraff</text>
  </g>

  <g transform="translate(40 1145)">
    <rect class="legend" width="990" height="28" rx="4"/>
    <text class="small" x="18" y="19">Unika f&#228;lt som e-post och mobilnummer beskrivs i dokumentationen och i databasdiagrammet, medan UML visar klassernas modell.</text>
  </g>
</svg>
