<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
  <style>
    .page { fill: #f8fafc; }
    .titleBox { fill: #111827; stroke: #111827; stroke-width: 2; }
    .title { font: bold 26px Arial, sans-serif; fill: #ffffff; }
    .subtitle { font: 15px Arial, sans-serif; fill: #e5e7eb; }
    .classBox { fill: #ffffff; stroke: #111827; stroke-width: 2.5; }
    .domainHead { fill: #dbeafe; stroke: #111827; stroke-width: 2.5; }
    .serviceHead { fill: #dcfce7; stroke: #111827; stroke-width: 2.5; }
    .viewHead { fill: #ede9fe; stroke: #111827; stroke-width: 2.5; }
    .dbHead { fill: #fef3c7; stroke: #111827; stroke-width: 2.5; }
    .sectionLine { stroke: #111827; stroke-width: 2; }
    .className { font: bold 18px Arial, sans-serif; fill: #111827; }
    .member { font: 14px Arial, sans-serif; fill: #111827; }
    .method { font: 14px Arial, sans-serif; fill: #111827; }
    .pk { font: bold 14px Arial, sans-serif; fill: #dc2626; }
    .fk { font: bold 14px Arial, sans-serif; fill: #2563eb; }
    .ak { font: bold 14px Arial, sans-serif; fill: #7c3aed; }
    .relation { stroke: #111827; stroke-width: 3.2; fill: none; marker-end: url(#arrow); }
    .assoc { stroke: #111827; stroke-width: 3.2; fill: none; }
    .labelBox { fill: #f9fafb; stroke: #374151; stroke-width: 2; }
    .label { font: bold 13px Arial, sans-serif; fill: #111827; }
    .small { font: 13px Arial, sans-serif; fill: #374151; }
    .legend { fill: #fff7ed; stroke: #9a3412; stroke-width: 2; }
  </style>

  <defs>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="11" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,10 L12,5 z" fill="#111827" />
    </marker>
  </defs>

  <rect class="page" width="1500" height="980"/>

  <g transform="translate(40 24)">
    <rect class="titleBox" width="1420" height="82" rx="6"/>
    <text class="title" x="28" y="35">Klassdiagram - Br&#228;dh&#246;rnan Labb 2</text>
    <text class="subtitle" x="28" y="62">Tydligt UML-diagram med raka relationer, kardinalitet, prim&#228;rnycklar och fr&#228;mmande nycklar.</text>
  </g>

  <!-- Medlem -->
  <g transform="translate(55 150)">
    <rect class="classBox" width="360" height="390"/>
    <rect class="domainHead" width="360" height="48"/>
    <text class="className" x="145" y="31">Medlem</text>
    <text class="pk" x="22" y="78">PK</text><text class="member" x="72" y="78">+ Id: int</text>
    <text class="member" x="22" y="108">+</text><text class="member" x="72" y="108">Medlemsnummer: int [NotMapped]</text>
    <text class="member" x="22" y="138">+</text><text class="member" x="72" y="138">Namn: string</text>
    <text class="member" x="22" y="168">+</text><text class="member" x="72" y="168">Efternamn: string</text>
    <text class="ak" x="22" y="198">AK</text><text class="member" x="72" y="198">+ Epost: string [unik]</text>
    <text class="ak" x="22" y="228">AK</text><text class="member" x="72" y="228">+ Mobilnummer: string [unik]</text>
    <text class="member" x="22" y="258">+</text><text class="member" x="72" y="258">Roll: string</text>
    <text class="member" x="22" y="288">+</text><text class="member" x="72" y="288">ArSparrad: bool</text>
    <text class="member" x="22" y="318">+</text><text class="member" x="72" y="318">Speltraffar: List&lt;SpelTraff&gt;</text>
    <line class="sectionLine" x1="0" y1="336" x2="360" y2="336"/>
    <text class="method" x="22" y="362">+ UppdateraKontaktuppgifter(...): void</text>
    <text class="method" x="22" y="384">+ Sparra() / Avsparra(): void</text>
  </g>

  <!-- SpelTraff -->
  <g transform="translate(570 150)">
    <rect class="classBox" width="390" height="430"/>
    <rect class="domainHead" width="390" height="48"/>
    <text class="className" x="150" y="31">SpelTraff</text>
    <text class="pk" x="22" y="78">PK</text><text class="member" x="72" y="78">+ Id: int</text>
    <text class="member" x="22" y="108">+</text><text class="member" x="72" y="108">Namn: string</text>
    <text class="member" x="22" y="138">+</text><text class="member" x="72" y="138">Plats: string</text>
    <text class="member" x="22" y="168">+</text><text class="member" x="72" y="168">DatumTid: DateTime</text>
    <text class="member" x="22" y="198">+</text><text class="member" x="72" y="198">MinDeltagare: int</text>
    <text class="member" x="22" y="228">+</text><text class="member" x="72" y="228">MaxDeltagare: int</text>
    <text class="member" x="22" y="258">+</text><text class="member" x="72" y="258">SpeltidMinuter: int</text>
    <text class="fk" x="22" y="288">FK</text><text class="member" x="72" y="288">+ SpelId: int</text>
    <text class="member" x="22" y="318">+</text><text class="member" x="72" y="318">Spel: Spel</text>
    <text class="member" x="22" y="348">+</text><text class="member" x="72" y="348">Deltagare: List&lt;Medlem&gt;</text>
    <text class="member" x="22" y="378">+</text><text class="member" x="72" y="378">LedigaPlatser: int</text>
    <line class="sectionLine" x1="0" y1="394" x2="390" y2="394"/>
    <text class="method" x="22" y="418">+ Anmal(medlem) / Avanmal(medlem): void</text>
  </g>

  <!-- Spel -->
  <g transform="translate(1115 150)">
    <rect class="classBox" width="330" height="320"/>
    <rect class="domainHead" width="330" height="48"/>
    <text class="className" x="145" y="31">Spel</text>
    <text class="pk" x="22" y="78">PK</text><text class="member" x="72" y="78">+ Id: int</text>
    <text class="member" x="22" y="108">+</text><text class="member" x="72" y="108">Titel: string</text>
    <text class="member" x="22" y="138">+</text><text class="member" x="72" y="138">Kategori: string</text>
    <text class="member" x="22" y="168">+</text><text class="member" x="72" y="168">MinSpelare: int</text>
    <text class="member" x="22" y="198">+</text><text class="member" x="72" y="198">MaxSpelare: int</text>
    <text class="member" x="22" y="228">+</text><text class="member" x="72" y="228">Speltraffar: List&lt;SpelTraff&gt;</text>
    <line class="sectionLine" x1="0" y1="246" x2="330" y2="246"/>
    <text class="method" x="22" y="272">+ Uppdatera(...): void</text>
    <text class="method" x="22" y="296">+ ToString(): string</text>
  </g>

  <!-- DbContext -->
  <g transform="translate(55 660)">
    <rect class="classBox" width="380" height="210"/>
    <rect class="dbHead" width="380" height="48"/>
    <text class="className" x="108" y="31">ForeningDbContext</text>
    <text class="member" x="22" y="82">+ Medlemmar: DbSet&lt;Medlem&gt;</text>
    <text class="member" x="22" y="112">+ Spel: DbSet&lt;Spel&gt;</text>
    <text class="member" x="22" y="142">+ Speltraffar: DbSet&lt;SpelTraff&gt;</text>
    <line class="sectionLine" x1="0" y1="160" x2="380" y2="160"/>
    <text class="method" x="22" y="188">+ OnModelCreating(...): void</text>
  </g>

  <!-- Service -->
  <g transform="translate(560 660)">
    <rect class="classBox" width="410" height="250"/>
    <rect class="serviceHead" width="410" height="48"/>
    <text class="className" x="132" y="31">ForeningService</text>
    <text class="method" x="22" y="82">+ StartaDatabasAsync(): Task</text>
    <text class="method" x="22" y="112">+ HamtaMedlemmarAsync(): Task&lt;List&lt;Medlem&gt;&gt;</text>
    <text class="method" x="22" y="142">+ HamtaSpelAsync(): Task&lt;List&lt;Spel&gt;&gt;</text>
    <text class="method" x="22" y="172">+ HamtaSpeltraffarAsync(): Task&lt;List&lt;SpelTraff&gt;&gt;</text>
    <text class="method" x="22" y="202">+ Registrera / Uppdatera / Ta bort</text>
    <text class="method" x="22" y="232">+ AnmalAsync() / AvanmalAsync()</text>
  </g>

  <!-- ViewModel -->
  <g transform="translate(1085 660)">
    <rect class="classBox" width="360" height="250"/>
    <rect class="viewHead" width="360" height="48"/>
    <text class="className" x="112" y="31">MainViewModel</text>
    <text class="member" x="22" y="82">+ Medlemmar: ObservableCollection</text>
    <text class="member" x="22" y="112">+ Spel: ObservableCollection</text>
    <text class="member" x="22" y="142">+ Speltraffar: ObservableCollection</text>
    <text class="member" x="22" y="172">+ ValdMedlem: Medlem</text>
    <text class="member" x="22" y="202">+ ValdTraff: SpelTraff</text>
    <text class="member" x="22" y="232">+ Commands</text>
  </g>

  <!-- Straight domain relationships -->
  <path class="assoc" d="M415 350 H570"/>
  <g transform="translate(448 278)">
    <rect class="labelBox" width="88" height="58" rx="4"/>
    <text class="label" x="13" y="23">0..*</text>
    <text class="small" x="13" y="44">deltar i</text>
  </g>
  <g transform="translate(448 366)">
    <rect class="labelBox" width="88" height="58" rx="4"/>
    <text class="label" x="13" y="23">0..*</text>
    <text class="small" x="13" y="44">har</text>
  </g>

  <path class="assoc" d="M960 310 H1115"/>
  <g transform="translate(994 238)">
    <rect class="labelBox" width="88" height="58" rx="4"/>
    <text class="label" x="13" y="23">0..*</text>
    <text class="small" x="13" y="44">traffar</text>
  </g>
  <g transform="translate(994 326)">
    <rect class="labelBox" width="88" height="58" rx="4"/>
    <text class="label" x="13" y="23">1</text>
    <text class="small" x="13" y="44">spel</text>
  </g>
  <g transform="translate(990 400)">
    <rect class="labelBox" width="100" height="46" rx="4"/>
    <text class="small" x="13" y="19">FK: SpelId</text>
    <text class="small" x="13" y="36">till Spel.Id</text>
  </g>

  <!-- Straight architecture relationships -->
  <path class="relation" d="M1085 785 H970"/>
  <g transform="translate(992 722)">
    <rect class="labelBox" width="74" height="42" rx="4"/>
    <text class="small" x="13" y="26">anropar</text>
  </g>

  <path class="relation" d="M560 785 H435"/>
  <g transform="translate(462 722)">
    <rect class="labelBox" width="70" height="42" rx="4"/>
    <text class="small" x="13" y="26">anvander</text>
  </g>

  <path class="relation" d="M245 660 V540"/>
  <g transform="translate(260 586)">
    <rect class="labelBox" width="130" height="42" rx="4"/>
    <text class="small" x="13" y="26">DbSet&lt;Medlem&gt;</text>
  </g>

  <path class="relation" d="M245 660 V615 H765 V580"/>
  <g transform="translate(540 600)">
    <rect class="labelBox" width="142" height="42" rx="4"/>
    <text class="small" x="13" y="26">DbSet&lt;SpelTraff&gt;</text>
  </g>

  <path class="relation" d="M435 765 H1280 V470"/>
  <g transform="translate(1128 545)">
    <rect class="labelBox" width="100" height="42" rx="4"/>
    <text class="small" x="13" y="26">DbSet&lt;Spel&gt;</text>
  </g>

  <g transform="translate(40 930)">
    <rect class="legend" width="1420" height="34" rx="5"/>
    <text class="small" x="18" y="22">PK = primarnyckel, FK = frammande nyckel, AK = alternativ unik nyckel. Kardinalitet 1 betyder exakt en koppling och 0..* betyder noll eller flera kopplingar.</text>
  </g>
</svg>
