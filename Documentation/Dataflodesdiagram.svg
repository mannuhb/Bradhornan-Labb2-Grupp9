<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="940" viewBox="0 0 1500 940">
  <style>
    .page { fill: #f8fafc; }
    .titleBox { fill: #111827; stroke: #111827; stroke-width: 2; }
    .title { font: bold 26px Arial, sans-serif; fill: #fff; }
    .subtitle { font: 15px Arial, sans-serif; fill: #e5e7eb; }
    .flow { fill: #eef2ff; stroke: #4338ca; stroke-width: 2.5; }
    .service { fill: #ecfdf5; stroke: #15803d; stroke-width: 2.5; }
    .database { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.5; }
    .table { fill: #fff; stroke: #111827; stroke-width: 2.5; }
    .tableHead { fill: #dbeafe; stroke: #111827; stroke-width: 2.5; }
    .joinHead { fill: #fef3c7; stroke: #111827; stroke-width: 2.5; }
    .relBox { fill: #f9fafb; stroke: #374151; stroke-width: 2; }
    .legend { fill: #fff7ed; stroke: #9a3412; stroke-width: 2; }
    .name { font: bold 18px Arial, sans-serif; fill: #111827; }
    .text { font: 15px Arial, sans-serif; fill: #111827; }
    .small { font: 13px Arial, sans-serif; fill: #374151; }
    .key { font: bold 15px Arial, sans-serif; fill: #111827; }
    .pk { font: bold 14px Arial, sans-serif; fill: #dc2626; }
    .fk { font: bold 14px Arial, sans-serif; fill: #2563eb; }
    .ak { font: bold 14px Arial, sans-serif; fill: #7c3aed; }
    .arrow { stroke: #111827; stroke-width: 3.5; fill: none; marker-end: url(#arrow); }
    .line { stroke: #111827; stroke-width: 3.2; fill: none; marker-end: url(#arrow); }
  </style>

  <defs>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="11" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,10 L12,5 z" fill="#111827" />
    </marker>
  </defs>

  <rect class="page" x="0" y="0" width="1500" height="940"/>

  <g transform="translate(40 24)">
    <rect class="titleBox" width="1420" height="82" rx="6"/>
    <text class="title" x="28" y="35">Datafl&#246;desdiagram och databasnycklar - Br&#228;dh&#246;rnan</text>
    <text class="subtitle" x="28" y="62">Alla relationer visar PK, FK och kardinalitet. Pilarna visar hur data g&#229;r genom applikationen och databasen.</text>
  </g>

  <!-- Application data flow -->
  <g transform="translate(50 140)">
    <rect class="flow" width="210" height="90" rx="6"/>
    <text class="name" x="30" y="34">MainWindow.xaml</text>
    <text class="text" x="30" y="62">Presentation</text>
  </g>

  <g transform="translate(330 140)">
    <rect class="flow" width="210" height="90" rx="6"/>
    <text class="name" x="34" y="34">MainViewModel</text>
    <text class="text" x="34" y="62">Binding + kommandon</text>
  </g>

  <g transform="translate(610 140)">
    <rect class="service" width="210" height="90" rx="6"/>
    <text class="name" x="35" y="34">ForeningService</text>
    <text class="text" x="35" y="62">Aff&#228;rslogik</text>
  </g>

  <g transform="translate(890 140)">
    <rect class="service" width="230" height="90" rx="6"/>
    <text class="name" x="28" y="34">ForeningDbContext</text>
    <text class="text" x="28" y="62">Entity Framework Core</text>
  </g>

  <g transform="translate(1190 140)">
    <rect class="database" width="250" height="90" rx="6"/>
    <text class="name" x="40" y="34">SQL Server LocalDB</text>
    <text class="text" x="40" y="62">BradhornanDb</text>
  </g>

  <path class="arrow" d="M260 185 H330"/>
  <path class="arrow" d="M540 185 H610"/>
  <path class="arrow" d="M820 185 H890"/>
  <path class="arrow" d="M1120 185 H1190"/>

  <!-- Database tables -->
  <g transform="translate(50 300)">
    <rect class="table" width="330" height="310"/>
    <rect class="tableHead" width="330" height="48"/>
    <text class="name" x="112" y="31">Medlemmar</text>
    <text class="pk" x="20" y="78">PK</text><text class="key" x="72" y="78">Id</text><text class="text" x="170" y="78">int</text>
    <text class="text" x="20" y="112">-</text><text class="text" x="72" y="112">Namn</text><text class="text" x="170" y="112">string</text>
    <text class="text" x="20" y="146">-</text><text class="text" x="72" y="146">Efternamn</text><text class="text" x="170" y="146">string</text>
    <text class="ak" x="20" y="180">AK</text><text class="key" x="72" y="180">Epost</text><text class="text" x="170" y="180">unik string</text>
    <text class="ak" x="20" y="214">AK</text><text class="key" x="72" y="214">Mobilnummer</text><text class="text" x="185" y="214">unik string</text>
    <text class="text" x="20" y="248">-</text><text class="text" x="72" y="248">Roll</text><text class="text" x="170" y="248">string</text>
    <text class="text" x="20" y="282">-</text><text class="text" x="72" y="282">ArSparrad</text><text class="text" x="170" y="282">bool</text>
  </g>

  <g transform="translate(585 300)">
    <rect class="table" width="330" height="245"/>
    <rect class="tableHead" width="330" height="48"/>
    <text class="name" x="145" y="31">Spel</text>
    <text class="pk" x="20" y="78">PK</text><text class="key" x="72" y="78">Id</text><text class="text" x="172" y="78">int</text>
    <text class="text" x="20" y="112">-</text><text class="text" x="72" y="112">Titel</text><text class="text" x="172" y="112">string</text>
    <text class="text" x="20" y="146">-</text><text class="text" x="72" y="146">Kategori</text><text class="text" x="172" y="146">string</text>
    <text class="text" x="20" y="180">-</text><text class="text" x="72" y="180">MinSpelare</text><text class="text" x="172" y="180">int</text>
    <text class="text" x="20" y="214">-</text><text class="text" x="72" y="214">MaxSpelare</text><text class="text" x="172" y="214">int</text>
  </g>

  <g transform="translate(1110 300)">
    <rect class="table" width="340" height="335"/>
    <rect class="tableHead" width="340" height="48"/>
    <text class="name" x="118" y="31">Speltraffar</text>
    <text class="pk" x="20" y="78">PK</text><text class="key" x="72" y="78">Id</text><text class="text" x="185" y="78">int</text>
    <text class="text" x="20" y="112">-</text><text class="text" x="72" y="112">Namn</text><text class="text" x="185" y="112">string</text>
    <text class="text" x="20" y="146">-</text><text class="text" x="72" y="146">Plats</text><text class="text" x="185" y="146">string</text>
    <text class="text" x="20" y="180">-</text><text class="text" x="72" y="180">DatumTid</text><text class="text" x="185" y="180">DateTime</text>
    <text class="text" x="20" y="214">-</text><text class="text" x="72" y="214">MinDeltagare</text><text class="text" x="185" y="214">int</text>
    <text class="text" x="20" y="248">-</text><text class="text" x="72" y="248">MaxDeltagare</text><text class="text" x="185" y="248">int</text>
    <text class="fk" x="20" y="282">FK</text><text class="key" x="72" y="282">SpelId</text><text class="text" x="185" y="282">till Spel.Id</text>
    <text class="text" x="20" y="316">-</text><text class="text" x="72" y="316">SpeltidMinuter</text><text class="text" x="205" y="316">int</text>
  </g>

  <g transform="translate(535 710)">
    <rect class="table" width="430" height="145"/>
    <rect class="joinHead" width="430" height="48"/>
    <text class="name" x="126" y="31">MedlemSpelTraff</text>
    <text class="pk" x="24" y="83">PK/FK</text><text class="key" x="95" y="83">DeltagareId</text><text class="text" x="230" y="83">till Medlemmar.Id</text>
    <text class="pk" x="24" y="119">PK/FK</text><text class="key" x="95" y="119">SpeltraffarId</text><text class="text" x="230" y="119">till Speltraffar.Id</text>
  </g>

  <!-- Straight relationship arrows with boxed labels -->
  <path class="line" d="M915 423 H1110"/>
  <g transform="translate(958 350)">
    <rect class="relBox" width="110" height="58" rx="4"/>
    <text class="small" x="14" y="23">1 Spel</text>
    <text class="small" x="14" y="44">0..* traffar</text>
  </g>
  <g transform="translate(958 445)">
    <rect class="relBox" width="110" height="46" rx="4"/>
    <text class="small" x="13" y="19">FK: SpelId</text>
    <text class="small" x="13" y="36">till Spel.Id</text>
  </g>

  <path class="line" d="M215 610 V782 H535"/>
  <g transform="translate(250 656)">
    <rect class="relBox" width="160" height="58" rx="4"/>
    <text class="small" x="16" y="23">1 Medlem</text>
    <text class="small" x="16" y="44">0..* anmalningar</text>
  </g>
  <g transform="translate(250 730)">
    <rect class="relBox" width="180" height="46" rx="4"/>
    <text class="small" x="16" y="19">FK: DeltagareId</text>
    <text class="small" x="16" y="36">till Medlemmar.Id</text>
  </g>

  <path class="line" d="M1280 635 V782 H965"/>
  <g transform="translate(1085 656)">
    <rect class="relBox" width="170" height="58" rx="4"/>
    <text class="small" x="16" y="23">1 Speltraff</text>
    <text class="small" x="16" y="44">0..* anmalningar</text>
  </g>
  <g transform="translate(1055 730)">
    <rect class="relBox" width="200" height="46" rx="4"/>
    <text class="small" x="16" y="19">FK: SpeltraffarId</text>
    <text class="small" x="16" y="36">till Speltraffar.Id</text>
  </g>

  <g transform="translate(50 880)">
    <rect class="legend" width="1400" height="38" rx="5"/>
    <text class="small" x="18" y="24">PK = primarnyckel. FK = frammande nyckel. AK = alternativ unik nyckel. Kardinalitet: 1 betyder exakt en post, 0..* betyder noll eller flera poster.</text>
  </g>
</svg>
