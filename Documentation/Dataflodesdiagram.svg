<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="780" viewBox="0 0 1360 780">
  <style>
    .title { font: bold 24px Arial, sans-serif; fill: #111; }
    .subtitle { font: 15px Arial, sans-serif; fill: #333; }
    .table { fill: #fff; stroke: #1f2937; stroke-width: 2; }
    .head { fill: #dbeafe; stroke: #1f2937; stroke-width: 2; }
    .joinhead { fill: #fef3c7; stroke: #1f2937; stroke-width: 2; }
    .service { fill: #ecfdf5; stroke: #166534; stroke-width: 2; }
    .view { fill: #f5f3ff; stroke: #5b21b6; stroke-width: 2; }
    .name { font: bold 17px Arial, sans-serif; fill: #111; }
    .text { font: 14px Arial, sans-serif; fill: #111; }
    .key { font: bold 14px Arial, sans-serif; fill: #111; }
    .pk { fill: #dc2626; font: bold 13px Arial, sans-serif; }
    .fk { fill: #2563eb; font: bold 13px Arial, sans-serif; }
    .ak { fill: #7c3aed; font: bold 13px Arial, sans-serif; }
    .arrow { stroke: #111; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    .line { stroke: #111; stroke-width: 2; fill: none; }
    .label { font: bold 14px Arial, sans-serif; fill: #111; }
    .small { font: 13px Arial, sans-serif; fill: #333; }
  </style>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L11,4 z" fill="#111" />
    </marker>
  </defs>

  <text x="40" y="44" class="title">Dataflödesdiagram och databasnycklar - Brädhörnan</text>
  <text x="40" y="70" class="subtitle">Raka pilar visar hur data går från WPF-vy till ViewModel, service, Entity Framework och SQL Server LocalDB.</text>

  <!-- Flow boxes -->
  <g transform="translate(40 105)">
    <rect width="190" height="78" rx="6" class="view"/>
    <text x="28" y="31" class="name">MainWindow.xaml</text>
    <text x="18" y="57" class="text">WPF View</text>
  </g>

  <g transform="translate(280 105)">
    <rect width="190" height="78" rx="6" class="view"/>
    <text x="34" y="31" class="name">MainViewModel</text>
    <text x="18" y="57" class="text">Commands + binding</text>
  </g>

  <g transform="translate(520 105)">
    <rect width="190" height="78" rx="6" class="service"/>
    <text x="35" y="31" class="name">ForeningService</text>
    <text x="18" y="57" class="text">Affärsflöden</text>
  </g>

  <g transform="translate(760 105)">
    <rect width="210" height="78" rx="6" class="service"/>
    <text x="30" y="31" class="name">ForeningDbContext</text>
    <text x="18" y="57" class="text">EF Core mapping</text>
  </g>

  <g transform="translate(1030 105)">
    <rect width="250" height="78" rx="6" class="service"/>
    <text x="42" y="31" class="name">SQL Server LocalDB</text>
    <text x="18" y="57" class="text">BradhornanDb</text>
  </g>

  <path d="M230 144 H280" class="arrow"/>
  <path d="M470 144 H520" class="arrow"/>
  <path d="M710 144 H760" class="arrow"/>
  <path d="M970 144 H1030" class="arrow"/>

  <text x="240" y="132" class="small">Binding</text>
  <text x="482" y="132" class="small">Async commands</text>
  <text x="717" y="132" class="small">DbContext</text>
  <text x="988" y="132" class="small">SQL</text>

  <!-- Medlemmar table -->
  <g transform="translate(70 260)">
    <rect width="300" height="275" class="table"/>
    <rect width="300" height="42" class="head"/>
    <text x="92" y="27" class="name">Medlemmar</text>

    <text x="16" y="72" class="pk">PK</text>
    <text x="54" y="72" class="key">Id</text>
    <text x="120" y="72" class="text">int</text>

    <text x="16" y="102" class="text">-</text>
    <text x="54" y="102" class="text">Namn</text>
    <text x="120" y="102" class="text">string</text>

    <text x="16" y="132" class="text">-</text>
    <text x="54" y="132" class="text">Efternamn</text>
    <text x="150" y="132" class="text">string</text>

    <text x="16" y="162" class="ak">AK</text>
    <text x="54" y="162" class="key">Epost</text>
    <text x="120" y="162" class="text">string, unik</text>

    <text x="16" y="192" class="ak">AK</text>
    <text x="54" y="192" class="key">Mobilnummer</text>
    <text x="155" y="192" class="text">string, unik</text>

    <text x="16" y="222" class="text">-</text>
    <text x="54" y="222" class="text">Roll</text>
    <text x="120" y="222" class="text">string</text>

    <text x="16" y="252" class="text">-</text>
    <text x="54" y="252" class="text">ArSparrad</text>
    <text x="150" y="252" class="text">bool</text>
  </g>

  <!-- Spel table -->
  <g transform="translate(530 260)">
    <rect width="300" height="215" class="table"/>
    <rect width="300" height="42" class="head"/>
    <text x="127" y="27" class="name">Spel</text>

    <text x="16" y="72" class="pk">PK</text>
    <text x="54" y="72" class="key">Id</text>
    <text x="120" y="72" class="text">int</text>

    <text x="16" y="102" class="text">-</text>
    <text x="54" y="102" class="text">Titel</text>
    <text x="120" y="102" class="text">string</text>

    <text x="16" y="132" class="text">-</text>
    <text x="54" y="132" class="text">Kategori</text>
    <text x="135" y="132" class="text">string</text>

    <text x="16" y="162" class="text">-</text>
    <text x="54" y="162" class="text">MinSpelare</text>
    <text x="155" y="162" class="text">int</text>

    <text x="16" y="192" class="text">-</text>
    <text x="54" y="192" class="text">MaxSpelare</text>
    <text x="160" y="192" class="text">int</text>
  </g>

  <!-- Speltraffar table -->
  <g transform="translate(970 260)">
    <rect width="330" height="305" class="table"/>
    <rect width="330" height="42" class="head"/>
    <text x="112" y="27" class="name">Speltraffar</text>

    <text x="16" y="72" class="pk">PK</text>
    <text x="54" y="72" class="key">Id</text>
    <text x="130" y="72" class="text">int</text>

    <text x="16" y="102" class="text">-</text>
    <text x="54" y="102" class="text">Namn</text>
    <text x="130" y="102" class="text">string</text>

    <text x="16" y="132" class="text">-</text>
    <text x="54" y="132" class="text">Plats</text>
    <text x="130" y="132" class="text">string</text>

    <text x="16" y="162" class="text">-</text>
    <text x="54" y="162" class="text">DatumTid</text>
    <text x="145" y="162" class="text">DateTime</text>

    <text x="16" y="192" class="text">-</text>
    <text x="54" y="192" class="text">MinDeltagare</text>
    <text x="170" y="192" class="text">int</text>

    <text x="16" y="222" class="text">-</text>
    <text x="54" y="222" class="text">MaxDeltagare</text>
    <text x="175" y="222" class="text">int</text>

    <text x="16" y="252" class="fk">FK</text>
    <text x="54" y="252" class="key">SpelId</text>
    <text x="130" y="252" class="text">int → Spel.Id</text>

    <text x="16" y="282" class="text">-</text>
    <text x="54" y="282" class="text">SpeltidMinuter</text>
    <text x="190" y="282" class="text">int</text>
  </g>

  <!-- Join table -->
  <g transform="translate(470 585)">
    <rect width="390" height="135" class="table"/>
    <rect width="390" height="42" class="joinhead"/>
    <text x="90" y="27" class="name">MedlemSpelTraff</text>

    <text x="16" y="75" class="pk">PK/FK</text>
    <text x="78" y="75" class="key">DeltagareId</text>
    <text x="190" y="75" class="text">int → Medlemmar.Id</text>

    <text x="16" y="108" class="pk">PK/FK</text>
    <text x="78" y="108" class="key">SpeltraffarId</text>
    <text x="205" y="108" class="text">int → Speltraffar.Id</text>
  </g>

  <!-- Straight relationship lines -->
  <path d="M830 365 H970" class="line"/>
  <text x="848" y="349" class="label">1 Spel</text>
  <text x="895" y="388" class="label">0..* Spelträffar</text>
  <text x="868" y="329" class="small">Spel.Id → Speltraffar.SpelId (FK)</text>

  <path d="M220 535 V650 H470" class="line"/>
  <text x="245" y="632" class="label">1 Medlem</text>
  <text x="360" y="674" class="label">0..* anmälningar</text>
  <text x="245" y="610" class="small">Medlemmar.Id → DeltagareId (FK)</text>

  <path d="M1135 565 V650 H860" class="line"/>
  <text x="1012" y="632" class="label">1 Spelträff</text>
  <text x="880" y="674" class="label">0..* anmälningar</text>
  <text x="930" y="610" class="small">Speltraffar.Id → SpeltraffarId (FK)</text>

  <text x="70" y="746" class="small">PK = Primärnyckel. FK = Främmande nyckel. AK = Alternativ unik nyckel. Kardinalitet visar hur många poster som kan kopplas i relationen.</text>
</svg>
